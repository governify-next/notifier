openapi: 3.0.0
info:
    title: Notifier API
    version: 1.0.0
    description: API for the Governify Notifier microservice
servers:
    - url: /
paths:
    /health:
        get:
            tags:
                - Health
            summary: Health check
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
    /api/v1/emails:
        post:
            tags:
                - Emails
            summary: Send an email through Resend
            security:
                - serviceBearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [to, subject]
                            properties:
                                to:
                                    type: array
                                    minItems: 1
                                    maxItems: 50
                                    items:
                                        type: string
                                        format: email
                                subject:
                                    type: string
                                    minLength: 1
                                text:
                                    type: string
                                html:
                                    type: string
                            anyOf:
                                - required: [text]
                                  properties:
                                      text:
                                          minLength: 1
                                - required: [html]
                                  properties:
                                      html:
                                          minLength: 1
                        example:
                            to:
                                - recipient@example.com
                                - another@example.com
                            subject: Governance report
                            text: Your governance report is ready.
            responses:
                '202':
                    description: Resend accepted the email
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    data:
                                        type: object
                                        required: [id]
                                        properties:
                                            id:
                                                type: string
                '400':
                    description: Invalid email payload
                '401':
                    description: Missing or invalid service JWT
                '502':
                    description: Resend did not confirm acceptance

components:
    securitySchemes:
        serviceBearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: Service access token issued by Governify Authenticator.
    schemas:
        Error:
            type: object
            properties:
                error:
                    type: string
                message:
                    type: string
